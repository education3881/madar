<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Chad. Five faint ruled lines cross the page like an open school register. On each line stand short upright tally strokes, all one height, all leaning gently the same way — a few on the top line, more on each line below, until the bottom line crowds toward the right edge and its last strokes fade, still being written. On that bottom line, the only warm mark on the page: a single kiln-orange stroke leaning the opposite way — the one entry the host wrote in the guest's own hand, the exam it convened so five thousand could finish.">

  <title>The Still · Chad — a register that added lines instead of opening a second book</title>
  <desc>Five faint horizontal rules cross the page, evenly spaced, like the lines of an open enrolment register. Short upright tally strokes stand on each rule, every stroke the same height, every stroke leaning gently rightward like one steady hand: three on the top line, five on the second, nine on the third, fourteen on the fourth — and on the fifth, bottom line, a crowd that presses toward the right edge, its final strokes fainter and fainter, an entry still being written. Nothing repeats architecturally; this is handwriting, a count growing line by line. Midway along the crowded bottom line sits the only warm mark on the page: a single kiln-orange stroke of the same height leaning the opposite way, with a short serif at its foot — the one entry the host system wrote in the guest's own hand, the borrowed exam it convened once so five thousand could finish. No fills, no volumes; the line is the image; the ground is paper-cream.</desc>

  <!-- Paper-cream ground. Nothing else underneath the line. -->
  <rect x="0" y="0" width="1200" height="600" fill="#FAFAF7"/>

  <!--
    ============================================================
    PRIMARY GESTURE — ink (#1A2B3C)
    The register: five faint rules, and on them the tally of a
    decade — the same short stroke, the same lean, more of it
    on every line down the page.
    Triple-weight discipline; no fills, no filters, no gradients.
    ============================================================
  -->
  <g id="ink-line"
     fill="none"
     stroke="#1A2B3C"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- THE RULES — five faint register lines -->
    <g stroke-width="1.6" stroke-opacity="0.28">
      <path d="M 120 171 C 420 167 780 167 1080 172"/>
      <path d="M 120 246 C 420 242 780 242 1080 247"/>
      <path d="M 120 321 C 420 317 780 317 1080 322"/>
      <path d="M 120 396 C 420 392 780 392 1080 397"/>
      <path d="M 120 471 C 420 467 780 467 1080 472"/>
    </g>

    <!-- LINE ONE — the first years of the policy: three entries -->
    <g stroke-width="2.4" stroke-opacity="0.6">
      <path d="M 150 173 C 151 161 154 149 157 137"/>
      <path d="M 206 173 C 207 161 210 149 213 137"/>
      <path d="M 263 173 C 264 161 267 149 270 137"/>
    </g>

    <!-- LINE TWO — five entries -->
    <g stroke-width="2.4" stroke-opacity="0.65">
      <path d="M 150 248 C 151 236 154 224 157 212"/>
      <path d="M 201 248 C 202 236 205 224 208 212"/>
      <path d="M 253 248 C 254 236 257 224 260 212"/>
      <path d="M 304 248 C 305 236 308 224 311 212"/>
      <path d="M 356 248 C 357 236 360 224 363 212"/>
    </g>

    <!-- LINE THREE — nine entries -->
    <g stroke-width="2.5" stroke-opacity="0.7">
      <path d="M 150 323 C 151 311 154 299 157 287"/>
      <path d="M 196 323 C 197 311 200 299 203 287"/>
      <path d="M 241 323 C 242 311 245 299 248 287"/>
      <path d="M 287 323 C 288 311 291 299 294 287"/>
      <path d="M 331 323 C 332 311 335 299 338 287"/>
      <path d="M 374 323 C 375 311 378 299 381 287"/>
      <path d="M 418 323 C 419 311 422 299 425 287"/>
      <path d="M 461 323 C 462 311 465 299 468 287"/>
      <path d="M 504 323 C 505 311 508 299 511 287"/>
    </g>

    <!-- LINE FOUR — fourteen entries -->
    <g stroke-width="2.6" stroke-opacity="0.74">
      <path d="M 150 398 C 151 386 154 374 157 362"/>
      <path d="M 190 398 C 191 386 194 374 197 362"/>
      <path d="M 230 398 C 231 386 234 374 237 362"/>
      <path d="M 269 398 C 270 386 273 374 276 362"/>
      <path d="M 307 398 C 308 386 311 374 314 362"/>
      <path d="M 345 398 C 346 386 349 374 352 362"/>
      <path d="M 382 398 C 383 386 386 374 389 362"/>
      <path d="M 418 398 C 419 386 422 374 425 362"/>
      <path d="M 454 398 C 455 386 458 374 461 362"/>
      <path d="M 489 398 C 490 386 493 374 496 362"/>
      <path d="M 523 398 C 524 386 527 374 530 362"/>
      <path d="M 557 398 C 558 386 561 374 564 362"/>
      <path d="M 590 398 C 591 386 594 374 597 362"/>
      <path d="M 623 398 C 624 386 627 374 630 362"/>
    </g>

    <!-- LINE FIVE — the war years: the line that crowds toward the edge -->
    <g stroke-width="2.6" stroke-opacity="0.8">
      <path d="M 150 473 C 151 461 154 449 157 437"/>
      <path d="M 186 473 C 187 461 190 449 193 437"/>
      <path d="M 222 473 C 223 461 226 449 229 437"/>
      <path d="M 257 473 C 258 461 261 449 264 437"/>
      <path d="M 291 473 C 292 461 295 449 298 437"/>
      <path d="M 324 473 C 325 461 328 449 331 437"/>
      <path d="M 356 473 C 357 461 360 449 363 437"/>
      <path d="M 387 473 C 388 461 391 449 394 437"/>
      <path d="M 418 473 C 419 461 422 449 425 437"/>
      <path d="M 448 473 C 449 461 452 449 455 437"/>
      <path d="M 477 473 C 478 461 481 449 484 437"/>
      <path d="M 506 473 C 507 461 510 449 513 437"/>
      <path d="M 534 473 C 535 461 538 449 541 437"/>
      <path d="M 562 473 C 563 461 566 449 569 437"/>
      <path d="M 589 473 C 590 461 593 449 596 437"/>
      <path d="M 616 473 C 617 461 620 449 623 437"/>
      <path d="M 643 473 C 644 461 647 449 650 437"/>
      <path d="M 670 473 C 671 461 674 449 677 437"/>
      <path d="M 697 473 C 698 461 701 449 704 437"/>
      <!-- (here sits the one stroke written the other way — in orange, below) -->
      <path d="M 782 473 C 783 461 786 449 789 437"/>
      <path d="M 808 473 C 809 461 812 449 815 437"/>
      <path d="M 834 473 C 835 461 838 449 841 437"/>
    </g>
    <!-- the entry still being written — strokes fading toward the edge -->
    <g stroke-width="2.2">
      <path stroke-opacity="0.5" d="M 860 473 C 861 461 864 449 867 437"/>
      <path stroke-opacity="0.38" d="M 885 473 C 886 461 889 449 892 437"/>
      <path stroke-opacity="0.27" d="M 909 473 C 910 461 913 449 916 437"/>
      <path stroke-opacity="0.18" d="M 932 473 C 933 461 936 449 939 437"/>
      <path stroke-opacity="0.11" d="M 954 473 C 955 461 958 449 961 437"/>
      <path stroke-opacity="0.06" d="M 975 473 C 976 461 979 449 982 437"/>
    </g>
  </g>

  <!--
    ============================================================
    SECOND GESTURE — kiln-orange (#C75B39)
    One stroke on the crowded line, the same height as all the
    others, leaning the opposite way, a short serif at its foot:
    the entry the host wrote in the guest's own hand. The only
    warm thing on the page.
    ============================================================
  -->
  <g id="orange-line"
     fill="none"
     stroke="#C75B39"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- the contrary stroke -->
    <path stroke-width="2.8" stroke-opacity="0.95" d="M 748 473 C 747 461 744 449 741 437"/>
    <!-- a short serif at its foot — entered, and held, on the same rule -->
    <path stroke-width="2.4" stroke-opacity="0.9" d="M 740 477 L 757 477"/>
  </g>
</svg>
