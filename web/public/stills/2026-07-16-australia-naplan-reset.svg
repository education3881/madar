<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Australia: a single long horizontal rule crosses the page, held level, with a low notch near its left end worn faint from years of everything clearing it. Above it the same hand has cut a second notch, higher and sharp-edged. Beneath the higher notch stands a field of small upright strokes — most clear of it, a third caught between the old mark and the new. The only warm mark on the page, a kiln-orange plumb line, drops from the new notch through three faint annual ticks, each at the same height as the last — the bar, holding still. In the lower corner, a small cluster of strokes stands far from the line: unreached, not unmeasured.">
  <title>The Still · Australia — the bar raised on purpose, then held level three cycles running</title>
  <desc>Paper-cream ground, pure line, no fills. A low old bar, worn faint, sits near the left; a step lifts it to a higher, sharp new bar cut boldly across the width. Beneath the new bar a light field of upright strokes rises from a level baseline — most just clear the new mark, one stalls between old and new. Three kiln-orange plumb lines drop from the new bar to short ticks at one identical height, joined by a faint level thread — three annual cycles, the bar unmoved. In the lower-right corner a small cluster stands apart: measured, not reached.</desc>

  <rect x="0" y="0" width="1200" height="600" fill="#FAFAF7"/>

  <!-- baseline, held dead level -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2" stroke-opacity="0.30" d="M 120 470 L 1080 470"/>
    <path stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="5 9" d="M 150 482 L 1040 482"/>
  </g>

  <!-- THE FIELD — a light crowd of strokes; most just clear the new bar, one caught between old and new -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5">
    <path stroke-width="1.9" d="M 300 470 L 300 232"/>
    <path stroke-width="1.9" d="M 352 470 L 352 220"/>
    <path stroke-width="1.9" d="M 404 470 L 404 240"/>
    <!-- one caught between the old (344) and new (250) marks -->
    <path stroke-width="2.2" stroke-opacity="0.72" d="M 456 470 L 456 300"/>
    <path stroke-width="1.9" d="M 520 470 L 520 226"/>
    <path stroke-width="1.9" d="M 572 470 L 572 238"/>
    <path stroke-width="1.9" d="M 664 470 L 664 222"/>
    <path stroke-width="1.9" d="M 716 470 L 716 244"/>
    <path stroke-width="1.9" d="M 768 470 L 768 230"/>
    <path stroke-width="1.9" d="M 860 470 L 860 236"/>
    <path stroke-width="1.9" d="M 912 470 L 912 226"/>
  </g>

  <!-- THE OLD BAR — low, near the left, worn faint; and the step that lifts it to the new height -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2.2" stroke-opacity="0.26" stroke-dasharray="14 8" d="M 170 344 L 250 344"/>
    <path stroke-width="2.4" stroke-opacity="0.55" d="M 250 344 L 250 258"/>
  </g>

  <!-- THE NEW BAR — higher, sharp-edged, bold, cut clean across the width, drawn over the field -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="4.2" stroke-opacity="0.97" d="M 250 250 L 1010 250"/>
    <path stroke-width="1.4" stroke-opacity="0.24" d="M 256 244 L 1004 244"/>
  </g>

  <!-- THE LONE CLUSTER — lower-right, apart from the field: measured, not reached -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5">
    <path stroke-width="2" d="M 1000 470 L 1000 402"/>
    <path stroke-width="2" d="M 1022 470 L 1022 416"/>
    <path stroke-width="2" d="M 1044 470 L 1044 408"/>
    <path stroke-width="1.6" stroke-opacity="0.42" d="M 992 402 L 1052 402"/>
  </g>

  <!-- SECOND GESTURE — kiln-orange (#C75B39): three plumbs from the new bar to ticks at one identical height -->
  <g fill="none" stroke="#C75B39" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="6" stroke-opacity="0.10" d="M 620 252 L 620 356"/>
    <path stroke-width="2.6" stroke-opacity="0.92" d="M 420 250 L 420 356"/>
    <path stroke-width="2.9" stroke-opacity="0.98" d="M 620 250 L 620 356"/>
    <path stroke-width="2.6" stroke-opacity="0.92" d="M 820 250 L 820 356"/>
    <!-- the level ticks, all at one height: the bar holding still -->
    <path stroke-width="2.8" stroke-opacity="0.95" d="M 402 356 L 438 356"/>
    <path stroke-width="3.2" stroke-opacity="0.99" d="M 600 356 L 640 356"/>
    <path stroke-width="2.8" stroke-opacity="0.95" d="M 802 356 L 838 356"/>
    <!-- faint level thread joining the three ticks -->
    <path stroke-width="1.2" stroke-opacity="0.34" stroke-dasharray="3 8" d="M 420 356 L 820 356"/>
    <!-- small plumb bobs -->
    <path stroke-width="2" stroke-opacity="0.8" d="M 620 356 l -5 8 l 5 6 l 5 -6 z"/>
  </g>
</svg>
