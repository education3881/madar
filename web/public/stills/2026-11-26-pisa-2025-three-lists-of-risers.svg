<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Three horizontal rules in ink on a paper-cream page, one above another. The top rule is short and starts late, from its own small upright tick; the two beneath it are long and start together far to the left, each from its own tick. All three end on one faint shared upright. Small open circles sit along each rule, many on the short top rule, fewer on the middle one and only five on the lowest. Four circles line up vertically through all three rules and are joined by faint upright threads. One circle on the middle rule, the only warm kiln-orange mark on the page, has a partner on the rule below it and none on the short rule above it, where the line runs empty.">
  <title>The Still · PISA 2025 · three lists of risers on three clocks</title>
  <desc>A composition for the first Edition 06 piece. Paper-cream ground, pure line, no fills, tone carried
  by stroke opacity alone. The three rules are the OECD's three lists of risers, drawn on one time scale from
  2015 at the left ticks to 2025 at the faint shared upright. The top rule is the list dated since 2022: it
  starts seven tenths of the way along because it covers three years, and it carries sixteen circles. The
  middle rule is the eleven systems whose science average rose between 2015 and 2025. The lowest is the five
  that cut their share of low performers and grew their share of top performers over the decade. The threads
  join the four systems named on all three lists. The orange circle is the one system named on both long
  lists and absent from the short one. The short rule above it runs empty, drawn without comment because the
  registers give none.</desc>
