<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Bangladesh. Ruled lines like an exercise book cross the page from the left in banded groups — the grades. The upper lines run long; each band below stops shorter, and the lowest band, the youngest classes, is cut shortest of all — a curriculum truncated from the bottom by a budget. At the far right, apart from everything, stand two faint vertical strokes: the margin of another country's page, the address the lessons are written toward. Between the longest line and that margin, the only warm mark on the page: a kiln-orange ring left open, a seal unsigned — the certificate no state has stamped.">

  <title>The Still · Bangladesh — an exercise book ruled toward another country's margin, and the seal left open</title>
  <desc>From the left edge, ruled writing-lines cross the page in four banded groups, like the grade bands of one school. The top band runs longest, its lines ending short of the right side; each band beneath it stops sooner; the lowest band — the youngest classes — is cut shortest of all. A single fine contour traces the ragged descending ends: the budget's edge, drawn. At the far right, separated from every line, stand two faint vertical strokes — the margin of another country's page, the address the lessons are written toward; none of the lines reaches it. Between the longest line and that margin floats the only warm mark on the page: a kiln-orange ring drawn almost closed and left open at its crown, a seal without a signature. No fills, no volumes; the line is the image; the ground is paper-cream.</desc>

  <!-- Paper-cream ground. Nothing else underneath the line. -->
  <rect x="0" y="0" width="1200" height="600" fill="#FAFAF7"/>

  <!--
    ============================================================
    PRIMARY GESTURE — ink (#1A2B3C)
    The exercise book: ruled lines in grade bands, each band
    truncated shorter than the one above — the cut from below.
    Triple-weight discipline; no fills, no filters, no gradients.
    ============================================================
  -->
  <g id="ink-lines"
     fill="none"
     stroke="#1A2B3C"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- BAND ONE — the oldest grades; the lines that run longest -->
    <g stroke-width="1.7" stroke-opacity="0.62">
      <path d="M 72 168 C 340 164 700 164 962 168"/>
      <path d="M 72 196 C 340 192 690 192 948 196"/>
      <path d="M 72 224 C 340 220 680 220 934 224"/>
    </g>
    <g stroke-width="1.1" stroke-opacity="0.34">
      <path d="M 72 182 C 340 179 694 179 954 182"/>
      <path d="M 72 210 C 340 207 684 207 940 210"/>
    </g>

    <!-- BAND TWO — shorter -->
    <g stroke-width="1.6" stroke-opacity="0.56">
      <path d="M 72 276 C 300 272 600 272 828 276"/>
      <path d="M 72 304 C 300 300 590 300 812 304"/>
    </g>
    <g stroke-width="1.1" stroke-opacity="0.3">
      <path d="M 72 290 C 300 287 594 287 820 290"/>
    </g>

    <!-- BAND THREE — shorter again -->
    <g stroke-width="1.5" stroke-opacity="0.5">
      <path d="M 72 356 C 260 352 500 352 700 356"/>
      <path d="M 72 384 C 260 380 490 380 684 384"/>
    </g>
    <g stroke-width="1.0" stroke-opacity="0.27">
      <path d="M 72 370 C 260 367 494 367 692 370"/>
    </g>

    <!-- BAND FOUR — the youngest classes, cut shortest of all -->
    <g stroke-width="1.5" stroke-opacity="0.46">
      <path d="M 72 436 C 200 432 400 432 542 436"/>
      <path d="M 72 464 C 200 460 390 460 524 464"/>
    </g>
    <g stroke-width="1.0" stroke-opacity="0.24">
      <path d="M 72 450 C 200 447 394 447 532 450"/>
    </g>

    <!-- THE BUDGET'S EDGE — one fine contour tracing the ragged,
         descending line-ends from the longest to the shortest. -->
    <path stroke-width="2.0" stroke-opacity="0.4" d="
      M 962 168
      C 950 200 928 246 828 276
      C 770 294 736 322 700 356
      C 664 390 610 414 542 436
      C 532 446 528 456 524 464
    "/>

    <!-- THE FAR MARGIN — two faint vertical strokes at the right:
         the margin of another country's page. No line reaches it. -->
    <g stroke-opacity="0.34">
      <path stroke-width="2.4" d="M 1106 136 C 1104 246 1104 356 1107 466"/>
    </g>
    <g stroke-opacity="0.2">
      <path stroke-width="1.5" d="M 1124 136 C 1122 246 1122 356 1125 466"/>
    </g>
  </g>

  <!--
    ============================================================
    SECOND GESTURE — kiln-orange (#C75B39)
    The seal left open: a ring drawn almost closed, its gap at
    the crown, floating between the longest line and the margin
    it never reaches. The only warm thing on the page.
    ============================================================
  -->
  <g id="orange-line"
     fill="none"
     stroke="#C75B39"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- the ring, open at the crown -->
    <path stroke-width="2.6" stroke-opacity="0.95" d="
      M 1032 246
      C 1010 254 998 274 1002 296
      C 1006 320 1028 336 1052 332
      C 1076 328 1092 306 1088 282
      C 1085 264 1072 252 1056 248
    "/>
    <!-- a short serif where a signature would begin, and does not -->
    <path stroke-width="2.4" stroke-opacity="0.9" d="M 1036 238 L 1044 246"/>
  </g>
</svg>
