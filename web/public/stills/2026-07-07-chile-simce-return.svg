<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Chile: a recording instrument's trace crosses the page in a fine, regular wave, then breaks off — a blank interval where the pen was lifted, bridged only by a faint dotted line, the years not measured. From an open pivot at the upper right a firm pen arm reaches down and touches the paper, and the trace resumes: it dips, climbs back to its old level, and steadies. Where it resumes it is doubled — beneath the ink line runs the only warm mark on the page, a kiln-orange companion trace, the instrument now writing two things at once. Under the resumed line, three small ticks: three deliveries, on time.">
  <title>The Still · Chile — the trace resumes after the silence, now writing two things at once</title>
  <desc>Paper-cream ground, pure line, no fills. A fine regular seismograph trace crosses from the left, then breaks into a blank interval bridged by a faint dotted line — the years the census was suspended. From an open pivot at the upper right a firm pen arm reaches down and touches the paper; the trace resumes, dips, climbs back to its old level and steadies. Along the resumed stretch it is doubled — beneath the ink runs a kiln-orange companion trace, the instrument now recording two things at once. Three small ticks below mark three deliveries, on time.</desc>
