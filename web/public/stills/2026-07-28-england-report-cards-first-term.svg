<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for the United Kingdom: where a single tall placard once stood bearing one word, the word has been lifted off and the placard divided into a grid of six panels, each a different depth of tone on one column — a scale of colours standing in for the scale of grades, most panels resting in the two calm middle bands, none at the darkest. Set a little apart, a second, smaller frame is turned back toward the grid, a measuring edge laid along it: the instrument that reads the instrument. The only warm mark on the page, a kiln-orange line, runs not down any single panel but along the seam between the grid and the small frame that measures it.">
  <title>The Still · United Kingdom — one word lifted off, a scale of tones in its place, and the frame that reads the frame</title>
  <desc>Paper-cream ground, pure line, no fills — tone carried by hatch density alone. A tall placard, its single word lifted off and drifting above, is divided into a column of six panels, each hatched to a different depth: most resting in the two calm middle bands, none at the darkest. Set a little apart, a second smaller frame turns back toward the grid with a measuring edge laid along it — the instrument that reads the instrument. A single kiln-orange line runs not down any panel but along the seam between the grid and the frame that measures it.</desc>
