<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Singapore: two vertical scales stand side by side. The left one, drawn faint, carries dozens of fine tick marks packed close — the retired aggregate that could distinguish more than two hundred ranks. The right one, drawn firm, carries twenty-nine wide-spaced marks — the new score. Between them, a few hairline curves gather clusters of fine ticks into single coarse ones: the ruler being folded. Beside the new scale, the only warm mark on the page, a kiln-orange caliper spans exactly seven of its divisions — the width, in the ministry's own figures, that school affiliation is worth at the admission door.">
  <title>The Still · Singapore — two hundred ranks folded into twenty-nine, and the width of an affiliation</title>
  <desc>Paper-cream ground, pure line, no fills. On the left a faint scale packed so densely with fine ticks it reads almost solid — the retired aggregate that split children into more than two hundred ranks. On the right a firm, airy scale of twenty-nine wide-spaced marks — the new score. Hairline curves between them gather clusters of the fine ticks into single coarse ones: the ruler folded. A bold kiln-orange caliper beside the new scale spans exactly seven of its divisions — the value, in the ministry’s own figures, of school affiliation at the admission door.</desc>
