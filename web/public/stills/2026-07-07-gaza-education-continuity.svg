<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Gaza. A single faint canvas line drapes across the top of the page — a tent roof implied by one shallow curve and one slim pole, nothing more. Beneath it, on a plain ground line, stand the firmest marks on the page: an empty school chair drawn in profile, facing a small table on which an exam sheet is propped upright. The sheet carries a faint printed header in ink; across its face sit the only warm marks on the page — a short kiln-orange line with a second, shorter one beginning beneath it: an answer, being written. The room holds only what the exam requires: a seat, a paper, a date being kept.">

  <title>The Still · Gaza — a chair, a paper, and the answer under way</title>
  <desc>One hairline curve sags across the upper page and rises to a single slim pole — canvas overhead, stated as lightly as possible; no walls are drawn. On a plain ground rule beneath it stand the heaviest marks of the drawing: a school chair in side profile, empty, its back upright, facing right; and across from it a small table on two legs. Propped upright on the table is an exam sheet, drawn as an open rectangle tilted slightly back, with one faint ink line at its head — the printed question. Across the sheet's face, the only warm thing on the page: a short kiln-orange stroke and a second, shorter stroke starting beneath it — the answer, in the middle of being written. No fills, no volumes, no debris of any kind; the line is the image; the ground is paper-cream.</desc>

  <!-- Paper-cream ground. Nothing else underneath the line. -->
  <rect x="0" y="0" width="1200" height="600" fill="#FAFAF7"/>

  <!--
    ============================================================
    THE CANVAS OVERHEAD — one draped hairline and one slim pole.
    The tent is implied, never built; no walls, no volume.
    ============================================================
  -->
  <g id="ink-canvas"
     fill="none"
     stroke="#1A2B3C"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path stroke-width="1.2" stroke-opacity="0.22" d="
      M 60 196
      C 300 238 560 224 818 128
      C 980 170 1080 188 1140 194
    "/>
    <path stroke-width="1.0" stroke-opacity="0.18" d="M 818 130 C 817 240 817 360 819 468"/>
  </g>

  <!--
    ============================================================
    PRIMARY GESTURE — ink (#1A2B3C)
    The exam room reduced to its parts: a ground line, an empty
    chair in profile, a small table, a propped sheet.
    Triple-weight discipline; no fills, no filters, no gradients.
    ============================================================
  -->
  <g id="ink-room"
     fill="none"
     stroke="#1A2B3C"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- the ground the room stands on -->
    <path stroke-width="2" stroke-opacity="0.32" d="M 150 470 C 460 466 800 466 1060 471"/>
    <path stroke-width="0.8" stroke-opacity="0.14" stroke-dasharray="6 9" d="M 190 484 C 470 481 760 481 1010 486"/>

    <!-- THE CHAIR — side profile, empty, facing the table.
         The firmest marks on the page. -->
    <g stroke-opacity="0.9">
      <!-- back post, rising with the slightest lean of use -->
      <path stroke-width="3.5" d="M 424 470 C 421 420 420 330 423 248"/>
      <!-- top rail of the back -->
      <path stroke-width="3.2" d="M 421 252 C 432 249 446 249 456 252"/>
      <!-- seat plane, back to front -->
      <path stroke-width="3.5" d="M 421 356 C 448 353 478 353 504 356"/>
      <!-- front leg -->
      <path stroke-width="3.2" d="M 502 356 C 501 394 500 434 501 470"/>
      <!-- rear brace between legs, faint -->
      <path stroke-width="1.4" stroke-opacity="0.3" d="M 424 420 L 501 424"/>
    </g>

    <!-- THE TABLE — small, two legs, enough for one paper -->
    <g stroke-opacity="0.85">
      <path stroke-width="3.0" d="M 556 352 C 590 349 638 349 668 352"/>
      <path stroke-width="2.8" d="M 566 352 C 565 392 564 434 565 470"/>
      <path stroke-width="2.8" d="M 658 352 C 657 392 656 434 657 470"/>
    </g>

    <!-- THE SHEET — propped upright on the table, tilted just back -->
    <g stroke-opacity="0.85">
      <path stroke-width="2.2" d="M 590 270 L 636 266 L 642 346 L 596 350 Z"/>
      <!-- the printed header — the question, in ink, faint -->
      <path stroke-width="1.3" stroke-opacity="0.35" d="M 598 282 L 630 279"/>
    </g>
  </g>

  <!--
    ============================================================
    SECOND GESTURE — kiln-orange (#C75B39)
    The answer, being written: one short line and the start of
    a second across the sheet's face. The only warm thing on
    the page.
    ============================================================
  -->
  <g id="orange-line"
     fill="none"
     stroke="#C75B39"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- the first written line — steady, slightly cursive -->
    <path stroke-width="2.6" stroke-opacity="0.95" d="
      M 599 302
      C 606 299 612 302 618 300
      C 624 298 629 300 633 299
    "/>
    <!-- the second line, begun -->
    <path stroke-width="2.4" stroke-opacity="0.9" d="
      M 600 318
      C 606 316 611 318 616 317
    "/>
  </g>
</svg>
