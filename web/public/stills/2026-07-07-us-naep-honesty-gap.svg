<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for the United States: a row of upright measuring sticks stands across the page, each cut with a single notch at its own height — the states' bars for one word, most of them gathered low. Right of centre, one taller, firmer stick carries two notches instead of one: the fixed federal ruler, its lower notch Basic, its upper notch Proficient. The scattered state notches span more distance than the two federal notches enclose. The only warm mark on the page, a kiln-orange sightline, arcs from one state's notch across the row and comes to rest on the fixed ruler — at the height of its lower notch.">
  <title>The Still · United States — fifty-one rulers for one word, and the fixed one they are read against</title>
  <desc>Paper-cream ground, pure line, no fills. A field of slender upright strokes, each notched once at its own height, most gathered low. Two faint horizontal guides cross the whole field at the heights of a single tall, firm ruler's two notches on the right — Basic below, Proficient above. The states' notches spill above and below the lower guide, spanning more than the two federal notches enclose. One kiln-orange sightline, the only warm mark, arcs from a high state notch to rest on the federal ruler at the height of its lower notch.</desc>

  <rect x="0" y="0" width="1200" height="600" fill="#FAFAF7"/>

  <!-- Faint underdrawing: the two federal thresholds carried across the whole field as ghost guides -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round">
    <path stroke-width="1" stroke-opacity="0.10" stroke-dasharray="2 10" d="M 150 380 L 1040 380"/>
    <path stroke-width="1" stroke-opacity="0.08" stroke-dasharray="2 12" d="M 150 230 L 1040 230"/>
    <!-- the ground the rulers stand on -->
    <path stroke-width="2" stroke-opacity="0.30" d="M 140 500 C 460 497 760 497 1060 500"/>
    <path stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="5 9" d="M 180 512 L 1010 512"/>
  </g>

  <!-- THE STATES — slender upright strokes, each notched once at its own height -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <!-- each state: a stick from the ground up past its notch, and a short notch tick -->
    <g stroke-opacity="0.82">
      <path stroke-width="2.2" d="M 168 500 C 167 452 167 420 169 396"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 158 400 L 182 398"/>
      <path stroke-width="2.2" d="M 212 500 C 211 448 211 404 213 370"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 202 374 L 226 372"/>
      <path stroke-width="2.2" d="M 256 500 C 255 460 255 430 257 408"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 246 412 L 270 410"/>
      <path stroke-width="2.2" d="M 300 500 C 299 442 299 392 301 354"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 290 358 L 314 356"/>
      <path stroke-width="2.2" d="M 344 500 C 343 456 343 418 345 386"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 334 390 L 358 388"/>
      <!-- a tall outlier reaching high above the field -->
      <path stroke-width="2.4" d="M 388 500 C 387 400 387 300 389 214"/><path stroke-width="2.6" stroke-opacity="0.95" d="M 377 218 L 403 216"/>
      <path stroke-width="2.2" d="M 432 500 C 431 452 431 408 433 372"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 422 376 L 446 374"/>
      <path stroke-width="2.2" d="M 476 500 C 475 462 475 434 477 410"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 466 414 L 490 412"/>
      <path stroke-width="2.2" d="M 520 500 C 519 444 519 396 521 350"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 510 354 L 534 352"/>
      <path stroke-width="2.2" d="M 564 500 C 563 456 563 420 565 392"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 554 396 L 578 394"/>
      <!-- a low outlier -->
      <path stroke-width="2.2" d="M 608 500 C 607 476 607 458 609 442"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 598 446 L 622 444"/>
      <path stroke-width="2.2" d="M 652 500 C 651 452 651 410 653 378"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 642 382 L 666 380"/>
      <path stroke-width="2.2" d="M 696 500 C 695 448 695 400 697 360"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 686 364 L 710 362"/>
      <path stroke-width="2.2" d="M 740 500 C 739 458 739 424 741 400"/><path stroke-width="2.4" stroke-opacity="0.9" d="M 730 404 L 754 402"/>
    </g>
  </g>

  <!-- THE FEDERAL RULER — right of centre, taller and firmer, two notches (Basic lower, Proficient upper) -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="3.8" stroke-opacity="0.96" d="M 900 500 C 898 380 898 250 902 146"/>
    <!-- luminous companion for the engraved feel -->
    <path stroke-width="1.3" stroke-opacity="0.26" d="M 894 496 C 892 380 892 252 896 150"/>
    <!-- upper notch — Proficient -->
    <path stroke-width="3.2" stroke-opacity="0.95" d="M 882 230 L 922 230"/>
    <!-- lower notch — Basic -->
    <path stroke-width="3.2" stroke-opacity="0.95" d="M 882 380 L 922 380"/>
    <!-- the two notches bracketed, to read them as the enclosed federal span -->
    <path stroke-width="1.2" stroke-opacity="0.45" d="M 936 230 L 944 230 L 944 380 L 936 380"/>
  </g>

  <!-- SECOND GESTURE — kiln-orange (#C75B39): the sightline from a high state notch resting on the federal lower notch -->
  <g fill="none" stroke="#C75B39" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft echo for luminosity (no gradient — a faint parallel) -->
    <path stroke-width="4.6" stroke-opacity="0.14" d="M 390 216 C 560 150 770 320 898 380"/>
    <!-- the sightline -->
    <path stroke-width="2.6" stroke-opacity="0.95" d="M 392 216 C 560 150 770 320 898 380"/>
    <!-- where it comes to rest — a small ring on the lower notch -->
    <circle cx="900" cy="380" r="7.5" stroke-width="2.4" stroke-opacity="0.95"/>
    <circle cx="900" cy="380" r="13" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>
</svg>
