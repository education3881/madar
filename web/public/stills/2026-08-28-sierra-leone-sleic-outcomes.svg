<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Sierra Leone: a classroom wall stands at the centre with a low chalk mark on it, and two measuring rods lean nearby — a tall one laid face-down on the ground, set aside, and a shorter one standing upright against the wall, its top aligned exactly with the mark. At the foot of the wall an open ledger lies flat with a few ruled lines, one entry shorter than the rest. The single warm mark on the page, a kiln-orange line, traces the chalk mark on the wall — the measurement the shorter ruler gave, kept.">
  <title>The Still · Sierra Leone — the shorter ruler kept, the taller one set aside, the ledger paid to the mark</title>
  <desc>Paper-cream ground, pure line, no fills — tone carried by hatch density alone. A classroom wall crosses the page bearing one low chalk mark. A short measuring rod stands upright against the wall, its top at the mark; a taller rod lies face-down on the ground, its graduations turned away. An open ledger at the wall's foot carries ruled entry lines, one drawn short. A single kiln-orange line traces the chalk mark.</desc>
  <rect x="0" y="0" width="1200" height="600" fill="#FAFAF7"/>

  <!-- ground line -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2" stroke-opacity="0.35" d="M 40 512 L 1160 512"/>
  </g>

  <!-- the wall -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="3.0" stroke-opacity="0.9" d="M 420 512 L 420 148 L 900 148 L 900 512"/>
    <!-- coursework hatching, sparse -->
    <path stroke-width="1.0" stroke-opacity="0.28" d="M 420 220 L 900 220 M 420 292 L 900 292 M 420 364 L 900 364 M 420 436 L 900 436"/>
    <path stroke-width="1.0" stroke-opacity="0.22" d="M 560 148 L 560 220 M 700 220 L 700 292 M 560 292 L 560 364 M 780 292 L 780 364 M 640 364 L 640 436 M 820 436 L 820 512 M 500 436 L 500 512"/>
  </g>

  <!-- the standing rod, shorter, top exactly at the mark -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="3.0" stroke-opacity="0.92" d="M 452 512 L 448 338"/>
    <!-- its graduations, facing the reader -->
    <path stroke-width="1.5" stroke-opacity="0.6" d="M 448 356 l 12 0 M 449 384 l 9 0 M 450 412 l 12 0 M 451 440 l 9 0 M 451 468 l 12 0 M 452 496 l 9 0"/>
  </g>

  <!-- the chalk mark on the wall — the single warm line -->
  <g fill="none" stroke="#D94F2A" stroke-linecap="round">
    <path stroke-width="4" stroke-opacity="0.95" d="M 436 336 L 522 334"/>
    <path stroke-width="1.4" stroke-opacity="0.5" d="M 440 342 L 508 340"/>
  </g>

  <!-- the taller rod, laid face-down on the ground, graduations turned away -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="3.0" stroke-opacity="0.85" d="M 130 486 L 396 470"/>
    <path stroke-width="1.4" stroke-opacity="0.4" d="M 133 494 L 399 478"/>
    <!-- blank face: one faint spine line only, no graduations -->
    <path stroke-width="1.0" stroke-opacity="0.25" d="M 142 490 L 388 475"/>
    <!-- small shadow hatch beneath -->
    <path stroke-width="1.0" stroke-opacity="0.2" d="M 150 500 l 18 -2 M 200 498 l 18 -2 M 250 495 l 18 -2 M 300 492 l 18 -2 M 350 489 l 18 -2"/>
  </g>

  <!-- the open ledger at the foot of the wall -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2.4" stroke-opacity="0.85" d="M 952 500 L 1044 486 L 1136 500 M 952 500 L 952 448 Q 998 436 1044 444 Q 1090 436 1136 448 L 1136 500 M 1044 486 L 1044 444"/>
    <!-- ruled entries, left page: five lines, the fourth drawn short -->
    <path stroke-width="1.3" stroke-opacity="0.55" d="M 964 458 l 66 -6 M 964 468 l 66 -6 M 964 478 l 66 -6 M 964 488 l 34 -3 M 964 498 l 66 -6"/>
    <!-- right page: sums ruled off -->
    <path stroke-width="1.3" stroke-opacity="0.55" d="M 1058 452 l 66 6 M 1058 462 l 66 6 M 1058 472 l 66 6"/>
    <path stroke-width="1.8" stroke-opacity="0.7" d="M 1058 484 l 66 6"/>
  </g>

  <!-- five small lot-stones along the wall's base, the fifth set slightly apart -->
  <g fill="none" stroke="#1A2B3C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" stroke-opacity="0.5">
    <path d="M 560 512 l 10 -14 l 14 0 l 8 14 Z"/>
    <path d="M 612 512 l 10 -16 l 14 0 l 8 16 Z"/>
    <path d="M 664 512 l 10 -18 l 14 0 l 8 18 Z"/>
    <path d="M 716 512 l 10 -16 l 14 0 l 8 16 Z"/>
    <path stroke-opacity="0.32" d="M 788 512 l 10 -12 l 14 0 l 8 12 Z"/>
  </g>
</svg>
