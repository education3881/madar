<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-label="A continuous ink drawing for Poland. Short, drifting strokes scatter across the left half of the page — children enrolled everywhere and nowhere. At the centre a single firm vertical stroke crosses the field like a rule in a statute book. To its right the same strokes run gathered and parallel, ruled like a class register filling line by line. Beneath the ruled band, the only warm mark on the page, a kiln-orange thread rises from the lower margin and ties into the lowest line with a small knot: the family benefit, wired to attendance.">

  <title>The Still · Poland — a scatter ruled into a register, and the thread knotted to it</title>
  <desc>On the left half of the page, short ink strokes drift at odd angles and varied heights — a dispersal, children enrolled everywhere and nowhere. At the centre one firm vertical stroke stands top to bottom, the heaviest mark on the page: the statute, the flipped default. To its right the same strokes lie down and run parallel — long, level, evenly spaced lines like a class register filling line by line, a few of them beginning just left of the rule and crossing it, the movement already under way. Beneath the ruled band a single kiln-orange thread — the only warm thing on the page — rises from the lower margin and ties into the lowest register line with a small knot: the benefit, wired to attendance. No fills, no volumes; the line is the image; the ground is paper-cream.</desc>

  <!-- Paper-cream ground. Nothing else underneath the line. -->
  <rect x="0" y="0" width="1200" height="600" fill="#FAFAF7"/>

  <!--
    ============================================================
    PRIMARY GESTURE — ink (#1A2B3C)
    The scatter: short drifting strokes, odd angles, loose field.
    Triple-weight discipline; no fills, no filters, no gradients.
    ============================================================
  -->
  <g id="ink-scatter"
     fill="none"
     stroke="#1A2B3C"
     stroke-linecap="round"
     stroke-linejoin="round">

    <g stroke-width="1.8" stroke-opacity="0.55">
      <path d="M 96 178 C 118 172 138 168 158 166"/>
      <path d="M 152 262 C 170 250 186 242 206 236"/>
      <path d="M 84 330 C 106 334 126 340 146 348"/>
      <path d="M 210 148 C 228 156 244 166 258 178"/>
      <path d="M 246 320 C 268 314 290 312 310 314"/>
      <path d="M 160 412 C 182 404 202 400 224 400"/>
      <path d="M 318 202 C 338 194 358 190 378 190"/>
      <path d="M 300 402 C 318 412 334 424 348 438"/>
      <path d="M 376 300 C 398 296 420 296 440 300"/>
      <path d="M 96 470 C 118 464 140 462 160 462"/>
    </g>
    <g stroke-width="1.3" stroke-opacity="0.34">
      <path d="M 132 214 C 150 210 166 208 184 208"/>
      <path d="M 236 236 C 252 228 268 224 286 222"/>
      <path d="M 350 148 C 368 144 386 144 402 146"/>
      <path d="M 262 458 C 282 452 302 450 322 450"/>
      <path d="M 400 236 C 418 232 436 232 452 234"/>
      <path d="M 356 356 C 376 352 396 352 414 354"/>
      <path d="M 200 348 C 216 342 232 340 250 340"/>
      <path d="M 428 420 C 448 414 468 412 486 412"/>
      <path d="M 452 168 C 470 166 488 166 504 168"/>
    </g>

    <!-- THE RULE — one firm vertical stroke: the statute, the flipped
         default. The heaviest mark on the page. -->
    <g stroke-opacity="0.92">
      <path stroke-width="3.6" d="M 583 140 C 581 246 581 354 584 460"/>
    </g>
    <!-- faint head and foot ticks — the rule is enacted, not grown -->
    <g stroke-width="1.4" stroke-opacity="0.2">
      <path d="M 573 140 L 595 140"/>
      <path d="M 573 460 L 595 460"/>
    </g>
  </g>

  <!--
    ============================================================
    THE REGISTER — ink, right of the rule.
    The same strokes lie down and run parallel: long, level,
    evenly spaced — a class register filling line by line.
    Two lines begin left of the rule and cross it: the movement
    that was already under way.
    ============================================================
  -->
  <g id="ink-register"
     fill="none"
     stroke="#1A2B3C"
     stroke-linecap="round"
     stroke-linejoin="round">

    <g stroke-width="1.7" stroke-opacity="0.6">
      <path d="M 614 208 C 780 204 950 204 1116 208"/>
      <path d="M 522 244 C 720 240 918 240 1116 244"/>
      <path d="M 614 280 C 780 276 950 276 1116 280"/>
      <path d="M 614 316 C 780 312 950 312 1116 316"/>
      <path d="M 538 352 C 730 348 924 348 1116 352"/>
      <path d="M 614 388 C 780 384 950 384 1116 388"/>
      <path d="M 614 424 C 780 420 950 420 1116 424"/>
    </g>
    <g stroke-width="1.2" stroke-opacity="0.36">
      <path d="M 614 190 C 780 187 950 187 1116 190"/>
      <path d="M 614 262 C 780 259 950 259 1116 262"/>
      <path d="M 614 334 C 780 331 950 331 1116 334"/>
      <path d="M 614 406 C 780 403 950 403 1116 406"/>
    </g>
  </g>

  <!--
    ============================================================
    SECOND GESTURE — kiln-orange (#C75B39)
    The thread: rising from the lower margin and tying into the
    lowest register line with a small knot — the benefit, wired
    to attendance. The only warm thing on the page.
    ============================================================
  -->
  <g id="orange-line"
     fill="none"
     stroke="#C75B39"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- the thread, rising -->
    <path stroke-width="2.6" stroke-opacity="0.95" d="
      M 872 560
      C 866 522 860 484 866 452
      C 869 438 874 430 878 426
    "/>
    <!-- the knot at the lowest line -->
    <path stroke-width="2.4" stroke-opacity="0.9" d="
      M 878 426
      C 890 418 898 428 888 433
      C 880 437 872 430 880 423
    "/>
  </g>
</svg>
