<title>Madār — Edition 03, July 2026 — cover</title>
<desc>Line-art cover in slate-navy on a cool pale ground: a continuous measurement trace crossing four disruptions and returning to the line each time, over a faint unbroken baseline. Continuity under disruption — school systems holding through war, disaster and collapse.</desc>
