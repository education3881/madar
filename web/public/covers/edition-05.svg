<svg class="ed-cover ed-cover-05" viewBox="0 0 680 880" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Madār — Edition 05, October 2026 — cover</title>
<desc>Line-art cover in deep green on a pale stone ground: six upright strokes stand at six different heights on one shared baseline, each notched at its own top, and a single continuous thread runs through all six notches from left to right. The fourth stroke carries a small open ring where the thread rests on it. Africa entire — six systems, each read on the instrument it chose for itself.</desc>
<style>
.ed-cover-05 .wm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;fill:#1A1410}
.ed-cover-05 .ar{font-family:'Amiri',Georgia,serif;fill:#1A1410}
.ed-cover-05 .kick{font-family:'JetBrains Mono','Courier New',monospace;fill:#2D6A4F;letter-spacing:3px}
.ed-cover-05 .th{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;fill:#1A1410}
.ed-cover-05 .thm{font-family:'JetBrains Mono','Courier New',monospace;fill:#2D6A4F;letter-spacing:2px}
</style>
<rect x="40" y="40" width="600" height="800" fill="#E4E8DF" stroke="#1A1410" stroke-width="1"/>
<rect x="54" y="54" width="572" height="772" fill="none" stroke="#1A1410" stroke-width="0.5"/>
<g stroke="#1A1410" stroke-width="0.7">
<path d="M74 68 V80 M68 74 H80"/><path d="M606 68 V80 M600 74 H612"/>
<path d="M74 800 V812 M68 806 H80"/><path d="M606 800 V812 M600 806 H612"/>
</g>
<text class="wm" x="340" y="120" text-anchor="middle" font-size="40">Madār</text>
<text class="ar" x="340" y="150" text-anchor="middle" font-size="22" direction="rtl">مدار</text>
<text class="kick" x="340" y="180" text-anchor="middle" font-size="12">EDITION 05 · OCTOBER 2026</text>
<line x1="300" y1="192" x2="380" y2="192" stroke="#2D6A4F" stroke-width="1"/>

<!-- six instruments, one baseline, one thread: each system read at its own height -->
<g>
  <!-- faint reference guides -->
  <g stroke="#1A1410" stroke-width="0.4" opacity="0.14">
    <line x1="130" y1="618" x2="550" y2="618"/>
    <line x1="130" y1="392" x2="550" y2="392"/>
  </g>
  <!-- the shared baseline: one continent -->
  <line x1="130" y1="618" x2="550" y2="618" stroke="#1A1410" stroke-width="0.9" opacity="0.40"/>

  <!-- the six strokes, each notched at its own top -->
  <g stroke="#1A1410" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
    <line x1="166" y1="618" x2="166" y2="498"/><line x1="157" y1="498" x2="175" y2="498" stroke-width="1.7"/>
    <line x1="242" y1="618" x2="242" y2="440"/><line x1="233" y1="440" x2="251" y2="440" stroke-width="1.7"/>
    <line x1="318" y1="618" x2="318" y2="524"/><line x1="309" y1="524" x2="327" y2="524" stroke-width="1.7"/>
    <line x1="394" y1="618" x2="394" y2="408"/><line x1="385" y1="408" x2="403" y2="408" stroke-width="1.7"/>
    <line x1="470" y1="618" x2="470" y2="470"/><line x1="461" y1="470" x2="479" y2="470" stroke-width="1.7"/>
    <line x1="534" y1="618" x2="534" y2="536"/><line x1="525" y1="536" x2="543" y2="536" stroke-width="1.7"/>
  </g>

  <!-- THE THREAD — one continuous line through all six notches, left to right -->
  <path d="M166 498 L242 440 L318 524 L394 408 L470 470 L534 536"
        fill="none" stroke="#2D6A4F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- where the thread rests on the fourth instrument: the continental read -->
  <circle cx="394" cy="408" r="5.5" fill="none" stroke="#2D6A4F" stroke-width="1.4"/>
  <circle cx="166" cy="498" r="2.4" fill="#2D6A4F"/>
  <circle cx="534" cy="536" r="2.4" fill="#2D6A4F"/>
</g>

<text class="th" x="340" y="752" text-anchor="middle" font-size="21">Africa entire</text>
<text class="thm" x="340" y="780" text-anchor="middle" font-size="11">SIX SYSTEMS · EVERY REGION</text>
<g transform="translate(340,802)">
<line x1="-34" y1="0" x2="-4" y2="0" stroke="#2D6A4F" stroke-width="1"/>
<line x1="-4" y1="-6" x2="-4" y2="6" stroke="#2D6A4F" stroke-width="1"/>
<line x1="4" y1="0" x2="34" y2="0" stroke="#2D6A4F" stroke-width="1"/>
</g>
</svg>
