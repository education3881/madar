<svg class="ed-cover ed-cover-06" viewBox="0 0 680 880" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Madār — Edition 06, 26 November to 6 December 2026 — cover</title>
<desc>Line-art cover in deep indigo on a pale blue-grey ground: three horizontal rules, one above another, drawn on one time scale. The top rule is short and starts late; the two beneath start together at the left. Small open circles sit along each, and four of them are threaded upright through all three. PISA 2025, read system by system, with every claim carrying its own span of years.</desc>
