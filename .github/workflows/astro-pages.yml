name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # fetch-depth: 0 — full history. The sitemap's <lastmod> is derived from
      # the last commit that touched each page's source files (see
      # web/src/lib/sitemapLastmod.mjs). checkout@v4 clones at depth 1 by
      # default, where `git log -- <path>` returns nothing: the build would pass
      # locally and emit a sitemap with no lastmod in CI. Ruling #16 — verify in
      # the judging environment. The resolver also throws on a shallow clone, so
      # if this line is ever removed the deploy fails loudly instead of quietly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Inbound discoverability contract (2026-09-01): robots.txt must exist in
      # dist, advertise exactly one Sitemap URL DERIVED from astro.config's own
      # site+base (ruling #36), pointing at a file that exists (ruling #37),
      # with zero Disallow lines. Proved per ruling #35 before landing: bites
      # on a removed robots.txt and on a Disallow injection, silent on the
      # real build. Fails the deploy loudly if the crawler-facing surface drifts.
      - name: robots.txt advertises the sitemap the build derives
        working-directory: .
        run: python3 agents/tools/qa_robots.py web/dist
      # Cluster contract (2026-09-03): the hreflang clusters a crawler
      # reassembles from our pages must be reciprocal, dereference to dist,
      # and equal the sitemap's own URL set — every sitemap URL in exactly one
      # cluster (or a NAMED no-alternate page), no cluster naming a URL the
      # sitemap omits, and the sitemap's xhtml:link alternates agreeing with
      # the page-level cluster (ruling #36 across two files). Proved per #35:
      # bit on first contact (the English home's canonical was `/madar`, not
      # `/madar/`, since 2026-05-25 — fixed in Base.astro the same run), bites
      # on a retargeted alternate and on an injected held-slug cluster.
      - name: hreflang clusters equal the sitemap set
        working-directory: .
        run: python3 agents/tools/qa_hreflang_clusters.py web/dist
      # Article-promise contract (2026-09-06): every `related:` slug and every
      # `sources[].url` an APPROVED article declares in frontmatter must be
      # rendered on its built page (asserted by existence in dist, ruling #37);
      # no placeholder source on an approved page. RelatedReading.astro drops
      # unresolvable slugs silently by design — this is the loud half. Proved
      # per #35: control silent; bites on a bogus related slug (rebuilt), a
      # removed source anchor, and a placeholder title. Reports the in-body
      # link count (0 by design) as a count, never as a pass.
      - name: article promises are kept on the built page
        working-directory: .
        run: python3 agents/tools/qa_body_links.py web/dist
      # Held drafts date nothing (2026-09-08). A commit touching only a held
      # file moved five live <lastmod> values twice in production (9886987,
      # 642fef2) while the held-leak sweep stayed green, because it enumerated
      # SLUGS and never DATES. The resolver now excludes held files on both
      # paths; this is the output-side twin — every URL carries a lastmod and
      # none is newer than max(newest approved content commit, newest chrome
      # commit), a ceiling derived from git rather than asserted (#36). Proved
      # per #35: control silent on the real build; bites on an injected
      # above-ceiling date and on a stripped lastmod.
      - name: no lastmod above the approved-and-chrome ceiling
        working-directory: .
        run: python3 agents/tools/qa_lastmod.py web/dist
      # A held piece contributes no BYTES (2026-09-09). The 09-08 fix stopped a
      # held draft contributing a DATE; this stops it contributing FILES. Its
      # hero still and share card live in public/, which Astro copies into dist
      # wholesale, so six assets for three unpublished Edition 05 pieces were
      # being SERVED at guessable URLs while the articles returned 404 — and the
      # stills are SVGs carrying their own <title>, so the withheld pieces'
      # subjects were readable on the origin. The build now removes them
      # (src/lib/heldAssets.mjs); this asserts the removal, and its control
      # asserts every approved asset is still served, so a sweep that deleted
      # the whole og/ directory could not pass.
      - name: a held piece contributes no bytes
        working-directory: .
        run: python3 agents/tools/qa_held_assets.py --dist web/dist
      # Every page reachable from its own front door — plus the orphan
      # allowlist, which is itself checked (exactly one entry, /404.html, and
      # it must exist). An exemption list is where defects hide.
      - name: every page reachable, and the orphan allowlist is honest
        working-directory: .
        run: python3 agents/tools/qa_reachability.py web/dist
      # Structured data is the only part of the page written FOR a machine, and
      # until today nothing in CI read it. qa_jsonld has existed since 08-29 and
      # ran only by hand in the daily run — so on 2026-09-11 it was extended and
      # immediately found that all 76 article pages had, since 08-23, pointed
      # author, publisher and isPartOf at a node defined nowhere on the site
      # (organizationNode() was written and never called). 228 dangling
      # references, 19 days, invisible to every check that dereferences URLs
      # rather than nodes. A layer no human ever reads needs its gate in CI more
      # than the layers we look at, not less.
      - name: the machine-readable layer honours its contract
        working-directory: .
        run: python3 agents/tools/qa_jsonld.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # verify — the 2026-08-29 forward question, answered. Every QA assertion runs
  # at BUILD time; the 07-02→07-07 outage proved a green build can coexist with
  # a stale origin (the deploy is a second gate, ruling #17). This job extends
  # ruling #16's "judging environment" to the minutes AFTER the push: it
  # downloads the exact artifact deploy-pages published, then polls the origin
  # until it serves those bytes — the probe is sitemap-0.xml, the widest
  # single-file fingerprint of a deploy (all 82 URLs with their lastmod; it
  # changes whenever any page's source does) — then byte-compares a five-file
  # sample across both languages. A CDN still propagating gets 5 minutes of retries; a deploy that
  # "succeeded" onto a misconfigured Pages source fails the run loudly instead
  # of leaving the drift for a human to notice days later.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      # IndexNow switch (2026-09-06 weekly review, the week's growth bet).
      # "off" = the step below logs what it WOULD submit and exits 0.
      # "on"  = it POSTs the served sitemap's URL set to api.indexnow.org.
      # Staged off by design: submitting our URLs to an external index is a
      # binding (ruling #7) and an action in the publication's name — the
      # founder turns it on, in one word, when he chooses. Nothing else in
      # this job changes with the switch.
      INDEXNOW: "off"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Origin serves this build, byte-for-byte
        run: |
          mkdir dist && tar -xf artifact.tar -C dist
          BASE="https://education3881.github.io/madar"
          ok=""
          for i in $(seq 1 20); do
            curl -fsSL "$BASE/sitemap-0.xml" -o live-probe || true
            if cmp -s live-probe dist/sitemap-0.xml; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::origin sitemap-0.xml never matched the deployed artifact after 5 minutes"
            exit 1
          fi
          fail=0
          for f in index.html ar/index.html rss.xml ar/rss.xml sitemap-index.xml; do
            curl -fsSL "$BASE/$f" -o live-file || { echo "::error::origin $f unreachable"; fail=1; continue; }
            cmp -s live-file "dist/$f" || { echo "::error::origin $f differs from the deployed artifact"; fail=1; }
          done
          exit $fail
      # Feed cache axis (2026-08-31, the 08-30 forward question): the byte-compare
      # above proves the origin SERVES the new feed; a reader's poll is governed by
      # the cache validators. Assert both feeds carry ETag + Last-Modified, and that
      # a conditional GET with that ETag returns 304 — the exact mechanism a feed
      # reader uses to decide "anything new?". Values are logged so consecutive runs
      # can be compared by eye for cross-deploy variance (an ETag that never changes
      # is ruling #39's invariant probe wearing a cache header). Cannot false-pass
      # on a stale origin: it runs only after the byte-compare has already bitten.
      - name: Feed cache validators work for a polling reader
        run: |
          BASE="https://education3881.github.io/madar"
          fail=0
          for f in rss.xml ar/rss.xml; do
            hdr=$(curl -fsSI "$BASE/$f") || { echo "::error::feed $f unreachable for HEAD"; fail=1; continue; }
            etag=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag"{print $2}')
            lm=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified"{print $2}')
            [ -n "$etag" ] || { echo "::error::feed $f serves no ETag — readers cannot poll cheaply"; fail=1; }
            [ -n "$lm" ]   || { echo "::error::feed $f serves no Last-Modified"; fail=1; }
            echo "feed=$f etag=$etag last-modified=$lm"
            if [ -n "$etag" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$BASE/$f")
              [ "$code" = "304" ] || { echo "::error::feed $f conditional GET returned $code, expected 304 — validator not honored"; fail=1; }
            fi
          done
          exit $fail
      # IndexNow (2026-09-06): the one inbound lever that needs no account —
      # only a key file we host (web/public/<key>.txt, under /madar/ so the
      # keyLocation covers every /madar/ URL) and a POST. The URL set is READ
      # FROM THE SERVED sitemap-0.xml, never from the tree (ruling #36: derive
      # the promise from the asset), and the step runs only after the
      # byte-compare above has proved the origin serves this build — so it can
      # never announce a URL the origin does not yet serve. Best-effort by
      # design: a non-2xx from the index is logged as a warning, not a deploy
      # failure — the deploy's job is the origin; notifying an index is not a
      # condition of publishing. Keys are public by protocol design.
      - name: IndexNow — announce the served URL set (switch in job env)
        run: |
          BASE="https://education3881.github.io/madar"
          KEY="66ec26c5232c206b2c4714fd916a29a8"
          curl -fsSL "$BASE/sitemap-0.xml" -o served-sitemap.xml
          grep -o '<loc>[^<]*</loc>' served-sitemap.xml | sed 's/<\/\?loc>//g' | sort -u > urls.txt
          n=$(wc -l < urls.txt | tr -d ' ')
          [ "$n" -gt 0 ] || { echo "::error::served sitemap yielded zero URLs — nothing to announce, something is wrong"; exit 1; }
          served_key=$(curl -fsSL "$BASE/$KEY.txt" || true)
          [ "$served_key" = "$KEY" ] || { echo "::error::key file not served at $BASE/$KEY.txt — IndexNow would 403"; exit 1; }
          python3 - <<'PY' > payload.json
          import json, sys
          urls = [u.strip() for u in open("urls.txt", encoding="utf-8") if u.strip()]
          json.dump({
            "host": "education3881.github.io",
            "key": "66ec26c5232c206b2c4714fd916a29a8",
            "keyLocation": "https://education3881.github.io/madar/66ec26c5232c206b2c4714fd916a29a8.txt",
            "urlList": urls,
          }, sys.stdout, ensure_ascii=False)
          PY
          if [ "$INDEXNOW" != "on" ]; then
            echo "IndexNow switch is '$INDEXNOW' — dry run. Would submit $n URLs from the served sitemap (key file verified served)."
            exit 0
          fi
          code=$(curl -s -o response.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @payload.json https://api.indexnow.org/indexnow)
          echo "IndexNow: submitted $n URLs, HTTP $code"
          case "$code" in
            200|202) echo "IndexNow accepted the set (200 = ok, 202 = key validation pending)";;
            *) echo "::warning::IndexNow returned HTTP $code — $(head -c 300 response.txt)";;
          esac

