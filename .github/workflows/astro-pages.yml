name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # fetch-depth: 0 — full history. The sitemap's <lastmod> is derived from
      # the last commit that touched each page's source files (see
      # web/src/lib/sitemapLastmod.mjs). checkout@v4 clones at depth 1 by
      # default, where `git log -- <path>` returns nothing: the build would pass
      # locally and emit a sitemap with no lastmod in CI. Ruling #16 — verify in
      # the judging environment. The resolver also throws on a shallow clone, so
      # if this line is ever removed the deploy fails loudly instead of quietly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
