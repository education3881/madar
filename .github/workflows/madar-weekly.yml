# Madār — the autonomous weekly review
#
# Sundays, 05:00 UTC = 09:00 Asia/Dubai. Runs after Sunday's daily run so the
# review reads a week that is closed rather than one still in progress.
#
# The review consolidates the guidebook register, reconciles the edition ledger,
# reads last week's growth bet against the numbers it promised, counts how many
# assertions actually gate the deploy, and decides on team expansion. It does not
# advance a piece; that is the daily run's job.

name: Madār — weekly review

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional instruction to append to the review"
        required: false
        type: string

# Shares the daily run's concurrency group on purpose. On a Sunday both are due
# within an hour of each other, and two agents editing the guidebook index at the
# same time is exactly how the 2026-08-23 near-clobber happened.
concurrency:
  group: madar-autonomous-run
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write   # dispatch the deploy; see madar-daily.yml, issue #6
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install site dependencies
        working-directory: web
        run: npm ci

      - name: record the operation's own date
        run: echo "MADAR_DATE=$(TZ=Asia/Dubai date +%F)" >> "$GITHUB_ENV"

      - name: remember the origin's starting point
        run: |
          git fetch origin main --quiet
          echo "ORIGIN_BEFORE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: the weekly review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Plain text pointing at the instruction file, and an explicit tool
          # grant — see the comment in madar-daily.yml for why both, and for what
          # the first cutover attempt did when the prompt was a slash command.
          prompt: |
            Read `.claude/skills/madar-weekly/SKILL.md` in this repository and follow
            it exactly. It is the complete operating instruction for this review: you
            are the CEO of Madār, the run is autonomous, and nobody will answer a
            question. Read `CLAUDE.md`, `agents/CHARTER.md` and `agents/RUNBOOK.md`
            first, as that file tells you to.

            Today is ${{ env.MADAR_DATE }} in Asia/Dubai, the operation's calendar.
            The runner's own clock is UTC; convert before dating anything.

            ${{ inputs.note }}
          # Single line and the same tool grant as the daily run — see the comment
          # in madar-daily.yml for why the multi-line form was abandoned.
          claude_args: '--model claude-opus-5 --max-turns 180 --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"'
          show_full_output: true

      - name: put the review in the run summary
        if: always()
        run: |
          REVIEW="agents/reviews/${MADAR_DATE}-weekly-review.html"
          {
            echo "## Madār weekly review — ${MADAR_DATE}"
            echo
            if [ -f "$REVIEW" ]; then
              echo "Review: [\`$REVIEW\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/${REVIEW})"
            else
              echo "**No review was written for ${MADAR_DATE}.** See the run log above."
            fi
            echo
            echo "Open founder decisions:"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          gh issue list --label founder-decision --state open \
            --json number,title,createdAt \
            --template '{{range .}}- #{{.number}} {{.title}} (open since {{timeago .createdAt}}){{"\n"}}{{end}}' \
            >> "$GITHUB_STEP_SUMMARY" || echo "_(could not list issues)_" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      # See madar-daily.yml for why this is here and why it is a workflow step
      # rather than something the review is trusted to remember (issue #6).
      - name: publish what the review pushed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          ORIGIN_AFTER="$(git rev-parse origin/main)"
          if [ "$ORIGIN_AFTER" = "$ORIGIN_BEFORE" ]; then
            echo "Origin unchanged; nothing to publish."
          else
            gh workflow run astro-pages.yml --ref main
            echo "Deploy dispatched for ${ORIGIN_AFTER:0:7}."
          fi

      - name: report a failed review
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # gh refuses to create an issue with a label that does not exist yet,
          # so make sure it does. Idempotent; the || true covers the second run.
          gh label create run-failure --color B60205 --description "An autonomous run did not complete" 2>/dev/null || true
          gh issue create \
            --title "Weekly review failed — ${MADAR_DATE}" \
            --label run-failure \
            --body "The weekly review for **${MADAR_DATE}** did not complete.

          Run log: ${RUN_URL}"
