# Madār — the founder's channel
#
# The autonomous runs are one-way: they produce briefs and push work. This is the
# way back in. Mention @claude in an issue or a pull-request comment and the run
# answers there, with the whole repository checked out.
#
# It exists mainly for founder decisions. The daily run opens issues labelled
# `founder-decision` with options, a recommendation, a stated default and a date;
# Vini replies on the issue — from a phone, from anywhere — and the reply reaches
# the operation without a session, a laptop, or a paste.
#
# Only users with write access to the repository can trigger this, and bot actors
# are rejected, so an issue opened by the daily run cannot start a loop.

name: Claude — founder channel

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write

    steps:
      # Full history again: anything that ends in a build needs the lastmod
      # resolver's git dates, and a founder question often ends in a build.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
