# Madār — the autonomous daily run
#
# This is the operation's heartbeat, moved off the founder's laptop (2026-09-14).
# Between 11 August and 14 September the daily run lived in a desktop app: it
# executed only when his machine was awake, and 11 of 34 days were dark. Every
# push also waited on him pasting a block. Both dependencies end here.
#
# The run is autonomous and commits its own work. The guard rails are not in this
# file — they are the twelve standing assertions in astro-pages.yml, which this
# push triggers, plus the verify job that byte-compares the published artifact
# against the live origin. A bad run fails the deploy; it does not reach a reader.
#
# Schedule: 04:23 UTC = 08:23 Asia/Dubai. It was 04:00 until 2026-09-15, when the
# first scheduled run landed roughly five and a half hours late. GitHub queues every
# repository's cron on the same minute together, and :00 of the hour is the most
# contended minute there is; an odd offset is the documented mitigation. If a run is
# still hours late on this offset, the delay is not contention and the next step is to
# stop planning the day around the cron at all (the 08-30 rule about a cadence the
# constraint does not support).
# GitHub's cron is best-effort and can drift or skip under load; a missed run is
# named in the next brief exactly as a dark day always has been.

name: Madār — daily run

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional instruction to append to the run (e.g. 'focus on the Arabic composition')"
        required: false
        type: string

# Never let two runs touch the tree at once. A scheduled run that overlaps a
# manual one would race on the index and on the edition ledger.
concurrency:
  group: madar-autonomous-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write      # the run commits and pushes its own work
      issues: write        # founder-decision issues, and failure reports
      pull-requests: write
      actions: write       # read the last deploy's result, AND dispatch the next one
                           # (issue #6, 2026-09-14: a push authenticated by this
                           # token starts no workflow, so the deploy has to be
                           # asked for explicitly — see the last step in this job)
      id-token: write      # required by the action's GitHub App authentication

    steps:
      # fetch-depth: 0 is LOAD-BEARING, not a default worth trimming. The sitemap's
      # lastmod resolver derives every URL's date from git history and fails loudly in a
      # shallow clone (ruling #16 - verify in the judging environment; the defect
      # that taught us this shipped on 2026-08-25). A depth-1 checkout here would
      # turn every run red for a reason that has nothing to do with the run.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Install before Claude starts so the run does not spend turns on plumbing.
      # npm ci, never npm install — a hand-edited lockfile killed CI for four days
      # in July 2026 and npm ci is what refuses to paper over it.
      - name: install site dependencies
        working-directory: web
        run: npm ci

      - name: record the operation's own date
        run: echo "MADAR_DATE=$(TZ=Asia/Dubai date +%F)" >> "$GITHUB_ENV"

      # Remember where the origin stood BEFORE the run, so the publish step at the
      # end can tell whether anything was actually pushed. Reading it afterwards
      # would be useless: by then the run's own commit is the origin.
      - name: remember the origin's starting point
        run: |
          git fetch origin main --quiet
          echo "ORIGIN_BEFORE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: the daily run
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The prompt is PLAIN TEXT that points at the instruction file, not a
          # slash command. The first cutover attempt (2026-09-14, run 34815261498)
          # passed `/madar-daily` and died in 88 milliseconds with num_turns 1,
          # zero cost and an empty modelUsage — the prompt never reached the model
          # at all, because a prompt beginning with `/` is dispatched as a slash
          # command and a slash command that does not resolve fails instantly
          # rather than falling back to text. Reading a file is not clever, and
          # it cannot fail for a reason that has nothing to do with the operation.
          prompt: |
            Read `.claude/skills/madar-daily/SKILL.md` in this repository and follow
            it exactly. It is the complete operating instruction for this run: you
            are the CEO of Madār, the run is autonomous, and nobody will answer a
            question. Read `CLAUDE.md`, `agents/CHARTER.md` and `agents/RUNBOOK.md`
            before planning anything, as that file tells you to.

            Today is ${{ env.MADAR_DATE }} in Asia/Dubai, the operation's calendar.
            The runner's own clock is UTC; convert before dating anything.

            ${{ inputs.note }}
          # Attempt 2 (2026-09-14) also failed fast. The prompt reached the action
          # this time, so the remaining suspect is this block: attempt 1's
          # claude_args was a multi-line list of BARE flags and parsed fine;
          # attempt 2 added a QUOTED value inside the same multi-line form, which
          # is not the shape the documentation uses. Single line, exactly as
          # documented, is the safer form and costs nothing.
          #
          # A plain-text prompt inherits NO tools — only a skill invocation picks
          # them up from its own frontmatter — so the grant has to be explicit and
          # has to cover everything the run does: shell for git, npm, the build and
          # the twelve QA assertions; the file tools for drafting and the brief;
          # and the web tools for reading registers, which this publication cannot
          # operate without. TodoWrite is dropped: it is not load-bearing and I am
          # not certain enough of the name to risk an invalid entry taking the
          # whole list down with it.
          claude_args: '--model claude-opus-5 --max-turns 180 --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"'
          # Diagnosis, not decoration. Both failed attempts printed "full output
          # hidden for security" and pointed here. Until this run is proved green
          # twice, an unreadable failure costs more than the output is worth — the
          # repository is public in its content and carries no secrets in its
          # source, and the action masks the token regardless. TURN THIS OFF once
          # the cutover is confirmed.
          show_full_output: true

      # The brief is the proof-of-work contract. On the desktop it was handed over
      # in chat; here it goes into the run summary so the founder can read the day
      # from a notification without opening the repository.
      - name: put today's brief in the run summary
        if: always()
        run: |
          BRIEF="agents/briefs/${MADAR_DATE}-daily-brief.html"
          {
            echo "## Madār — ${MADAR_DATE}"
            echo
            if [ -f "$BRIEF" ]; then
              echo "Brief: [\`$BRIEF\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/${BRIEF})"
              echo
              # The lede carries the day's headline and dek, which is the digest.
              # Every brief since the template was fixed has <section class="lede">;
              # if that ever stops being true this prints nothing rather than lying,
              # and the link above still works.
              sed -n '/<section class="lede">/,/<\/section>/p' "$BRIEF" \
                | sed -e 's/<[^>]*>//g' \
                | python3 -c 'import html,sys; print(html.unescape(sys.stdin.read()))' \
                | sed -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*//'
            else
              echo "**No brief was written for ${MADAR_DATE}.**"
              echo
              echo "A day with no brief is a failed day, regardless of what else happened."
              echo "See the run log above for where it stopped."
            fi
            echo
            echo "---"
            echo
            echo "Latest commits:"
            git log -3 --pretty="- \`%h\` %s" | cut -c1-200
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Publish what the run pushed (issue #6, 2026-09-14) ----------------
      #
      # The first cloud run worked, pushed its own commits, and NOTHING DEPLOYED.
      # A push authenticated by this job's token starts no workflow — GitHub
      # suppresses it deliberately, to stop a workflow triggering itself forever.
      # That protection is correct and we are not working around it: we are asking
      # for the deploy explicitly, by name, which is a different thing and is what
      # `workflow_dispatch` exists for.
      #
      # Why this lives in the workflow and not in the run's instructions: the run
      # reported it could neither trigger a workflow nor write one, and a step that
      # must happen every single time should not depend on an agent remembering to
      # do it. Deterministic, or it is not a gate.
      #
      # It fires only when the origin actually moved. A run that held everything —
      # which is the correct outcome on plenty of days — publishes nothing and
      # should not spend a deploy proving it.
      - name: publish what the run pushed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          ORIGIN_AFTER="$(git rev-parse origin/main)"
          if [ "$ORIGIN_AFTER" = "$ORIGIN_BEFORE" ]; then
            echo "Origin unchanged at ${ORIGIN_BEFORE:0:7} — the run pushed nothing, so there is nothing to publish."
            echo "- Origin unchanged; no deploy dispatched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Origin moved ${ORIGIN_BEFORE:0:7} -> ${ORIGIN_AFTER:0:7}; dispatching the deploy."
            gh workflow run astro-pages.yml --ref main
            echo "- Deploy dispatched for \`${ORIGIN_AFTER:0:7}\`. The verify job byte-compares the origin; check it went green." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A silent failure is the failure mode this migration exists to end. If the
      # run dies, say so somewhere the founder will see without going looking.
      # Uses the gh CLI rather than actions/github-script, which still targets
      # Node 20 and warns on every run. One less deprecated dependency, and gh
      # is preinstalled on the runner.
      - name: report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # gh refuses to create an issue with a label that does not exist yet,
          # so make sure it does. Idempotent; the || true covers the second run.
          gh label create run-failure --color B60205 --description "An autonomous run did not complete" 2>/dev/null || true
          gh issue create \
            --title "Daily run failed — ${MADAR_DATE}" \
            --label run-failure \
            --body "The autonomous daily run for **${MADAR_DATE}** did not complete.

          Run log: ${RUN_URL}

          This is a dark day unless the next run picks it up. The following run
          should name it plainly in the brief and carry whatever was owed."
